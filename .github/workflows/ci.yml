name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: order_management
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Wait for MySQL and load schema
        run: |
          for i in {1..10}; do
            mysql -h127.0.0.1 -P3306 -uroot -prootpassword -e "SELECT 1" && break
            sleep 3
          done
          mysql -h127.0.0.1 -P3306 -uroot -prootpassword < scripts/schema.sql

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: E2E tests
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: rootpassword
          DB_DATABASE: order_management
          DB_SYNCHRONIZE: "false"
          JWT_SECRET: test_secret_ci_only
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_SECRET: test_refresh_secret_ci_only
          JWT_REFRESH_EXPIRES_IN: 7d
          FRONTEND_URL: http://localhost:3001
          PORT: 3000
        run: npm run test:e2e